<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>🌧 Rain Prediction</h1>

        <form action="/predict" method="POST">

            <label for="MinTemp">Minimum Temperature (°C)</label>
            <input
                type="number"
                id="MinTemp"
                name="MinTemp"
                step="any"
                placeholder="Enter minimum temperature"
                required
            >

            <label for="MaxTemp">Maximum Temperature (°C)</label>
            <input
                type="number"
                id="MaxTemp"
                name="MaxTemp"
                step="any"
                placeholder="Enter maximum temperature"
                required
            >

            <label for="Rainfall">Rainfall (mm)</label>
            <input
                type="number"
                id="Rainfall"
                name="Rainfall"
                step="any"
                placeholder="Enter rainfall"
                required
            >

            <button type="submit">Predict</button>

        </form>

        {% if prediction %}
        <div class="result">
            {% if prediction == "Rain Tomorrow" %}
                ☔ <strong>{{ prediction }}</strong>
            {% else %}
                ☀️ <strong>{{ prediction }}</strong>
            {% endif %}
        </div>
        {% endif %}

    </div>

</body>
</html>
