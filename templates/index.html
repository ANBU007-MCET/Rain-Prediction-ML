<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🌧 Rain Prediction</h1>

    <form action="/predict" method="POST">

        <label for="MinTemp">Minimum Temperature (°C)</label>
        <input
            type="number"
            id="MinTemp"
            name="MinTemp"
            step="any"
            placeholder="Enter Minimum Temperature"
            value="{{ min_temp if min_temp is defined else '' }}"
            required
        >

        <label for="MaxTemp">Maximum Temperature (°C)</label>
        <input
            type="number"
            id="MaxTemp"
            name="MaxTemp"
            step="any"
            placeholder="Enter Maximum Temperature"
            value="{{ max_temp if max_temp is defined else '' }}"
            required
        >

        <label for="Rainfall">Rainfall (mm)</label>
        <input
            type="number"
            id="Rainfall"
            name="Rainfall"
            step="any"
            placeholder="Enter Rainfall"
            value="{{ rainfall if rainfall is defined else '' }}"
            required
        >

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
    <div class="result">
        {% if prediction == "Rain Tomorrow" %}
            ☔ <strong>{{ prediction }}</strong>
        {% elif prediction == "No Rain Tomorrow" %}
            ☀️ <strong>{{ prediction }}</strong>
        {% else %}
            {{ prediction }}
        {% endif %}
    </div>
    {% endif %}

</div>

</body>
</html>
