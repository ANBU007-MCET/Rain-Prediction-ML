<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🌧 Rain Prediction System</h1>
    <p class="subtitle">Machine Learning Based Weather Prediction</p>

    <form action="/predict" method="POST">

        <label>🌡 Minimum Temperature (°C)</label>
        <input type="number" step="any" name="MinTemp"
               value="{{ min_temp if min_temp is defined else '' }}"
               placeholder="Enter Minimum Temperature" required>

        <label>🌞 Maximum Temperature (°C)</label>
        <input type="number" step="any" name="MaxTemp"
               value="{{ max_temp if max_temp is defined else '' }}"
               placeholder="Enter Maximum Temperature" required>

        <label>🌧 Rainfall (mm)</label>
        <input type="number" step="any" name="Rainfall"
               value="{{ rainfall if rainfall is defined else '' }}"
               placeholder="Enter Rainfall" required>

        <label>💧 Humidity at 3 PM (%)</label>
        <input type="number" step="any" name="Humidity3pm"
               value="{{ humidity3pm if humidity3pm is defined else '' }}"
               placeholder="Enter Humidity" required>

        <label>🌬 Wind Speed at 3 PM (km/h)</label>
        <input type="number" step="any" name="WindSpeed3pm"
               value="{{ windspeed3pm if windspeed3pm is defined else '' }}"
               placeholder="Enter Wind Speed" required>

        <label>🌡 Pressure at 3 PM (hPa)</label>
        <input type="number" step="any" name="Pressure3pm"
               value="{{ pressure3pm if pressure3pm is defined else '' }}"
               placeholder="Enter Pressure" required>

        <label>☀ Sunshine (Hours)</label>
        <input type="number" step="any" name="Sunshine"
               value="{{ sunshine if sunshine is defined else '' }}"
               placeholder="Enter Sunshine Hours" required>

        <button type="submit">🔍 Predict Rain</button>

    </form>

    {% if prediction %}
        {% if "Rain Tomorrow" in prediction %}
            <div class="result rain">
                ☔ <strong>{{ prediction }}</strong>
            </div>
        {% elif "No Rain Tomorrow" in prediction %}
            <div class="result norain">
                ☀ <strong>{{ prediction }}</strong>
            </div>
        {% else %}
            <div class="result">
                {{ prediction }}
            </div>
        {% endif %}
    {% endif %}

</div>

</body>
</html>
