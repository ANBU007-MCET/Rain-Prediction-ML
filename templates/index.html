<!DOCTYPE html>
<html>
<head>
    <title>Rain Prediction</title>
</head>

<body>

    <h1>Rain Prediction</h1>

    <form action="/predict" method="post">

        <label>Minimum Temperature</label><br>
        <input type="number" step="any" name="MinTemp" required><br><br>

        <label>Maximum Temperature</label><br>
        <input type="number" step="any" name="MaxTemp" required><br><br>

        <label>Rainfall</label><br>
        <input type="number" step="any" name="Rainfall" required><br><br>

        <input type="submit" value="Predict">

    </form>

    <h2>{{ prediction }}</h2>

</body>
</html>
